bus:
{
	port = 0;
	# Optional: the robot's physical puck set, bit n = node n (0x001E for a
	# 4-DOF WAM, 0x01FE for a wam8g).  With it, a missing puck stops startup
	# instead of changing which WAM is detected.
	#   expected_puck_mask = 0x001E;
	# Optional torque timing, see doc/canopen.md.  Defaults: false and 2.
	#   torque_on_arrival = true;
	#   torque_interpolation_ms = 1;
	#   wrist_sync_first = true;
};

@include "wam3.conf"
@include "wam4.conf"
@include "wam7w.conf"
@include "wam7g.conf"
@include "wam8g.conf"


# The CONFIG_VERSION number is used during the upgrade process to detect
# out-of-date configuration files. Please do not change it.
CONFIG_VERSION = 1;
