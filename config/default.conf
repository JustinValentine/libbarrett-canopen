bus:
{
	port = 0;
	# Optional.  Declares the physical puck set (bit n = node n) so that a
	# missing puck stops startup instead of changing the detected product;
	# an eight-puck wam8g losing node 8 would otherwise look like a 7-DOF
	# WAM.  Set it in the host's own copy of this file, e.g. for the
	# IROS robot (WAM 1-4, passive encoder 5, wrist motors 6-8):
	#   expected_puck_mask = 0x01FE;
	# Without it the product is identified from the pucks that answer, as
	# libbarrett always has.
};

@include "wam3.conf"
@include "wam4.conf"
@include "wam7w.conf"
@include "wam7g.conf"
@include "wam8g.conf"


# The CONFIG_VERSION number is used during the upgrade process to detect
# out-of-date configuration files. Please do not change it.
CONFIG_VERSION = 1;
