		( -0.7854,  0.7854, -0.7854,  0.0000, 0.0, -0.5236,  0.2618,  0.0000 ),
		( -0.7854,  0.7854, -0.7854,  0.0000, 0.0,  0.0000,  0.5236,  0.0000 )
