		( 0.0,  1.5708,     0.0,    0.0 )
	);

	# wam8g: 15 poses, the 9 original arm configurations (six used twice) with wider
	# wrist angles; J5 stays 0 (pinned).  No elbow hyperextension: J4 >= 0 in every
	# pose (the stock J4 -22.5/-45 deg poses pushed into the -0.9 rad stop once the
	# zero was off; the -0.03 rad approach reaches -1.7 deg).  Wrist targets keep
	# |J6| <= 60 and |J7|+|J8| <= 30 deg: inside the ROM whichever way J7/J8 point.
	wam8g:
	(
		#    J1       J2       J3       J4     J5      J6       J7       J8
		(  0.0000, -1.5708,  0.0000,  1.5708, 0.0,  0.0000,  0.0000,  0.2618 ),
