		(  0.0000, -1.5708,  0.0000,  1.5708, 0.0,  0.0000,  0.0000,  0.2618 ),
		(  0.0000, -1.5708,  0.0000,  1.5708, 0.0, -0.5236, -0.2618,  0.2618 ),
		(  0.7854, -1.5708,  1.5708,  1.5708, 0.0,  1.0472,  0.0000,  0.2618 ),
		( -0.7854, -1.5708, -1.5708,  1.5708, 0.0,  0.0000,  0.0000,  0.2618 ),
